server {
    listen 80;
    listen [::]:80;
    server_name dev.yytt.com.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/wechat-channels-ai-demo-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.yytt.com.cn;

    ssl_certificate /etc/letsencrypt/live/dev.yytt.com.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.yytt.com.cn/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:4310;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_read_timeout 75s;
    }
}
